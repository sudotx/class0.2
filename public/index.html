<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Auth Demo — OAuth / OIDC</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main>
        <h1>OAuth / OIDC Demo</h1>
        <p class="subtitle">Delegated login via Google. The server exchanges the authorization code, verifies the ID token, and issues its own JWT.</p>

        <section id="authed" hidden>
            <p>Logged in as <strong id="whoami"></strong></p>
            <button id="logoutBtn">Discard token</button>
        </section>

        <section id="anon">
            <a id="googleLoginBtn" href="/auth/google"><button type="button">Login with Google</button></a>
            <p class="hint">Requires GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REDIRECT_URI set in .env from Google Cloud Console.</p>
        </section>

        <pre id="log"></pre>
    </main>
    <script src="app.js"></script>
</body>
</html>
