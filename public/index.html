<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Auth Demo — Stateless JWT</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main>
        <h1>Stateless JWT Demo</h1>
        <p class="subtitle">Login returns a self-contained signed JWT. No server-side session store — the token itself proves identity.</p>

        <section id="authed" hidden>
            <p>Logged in as <strong id="whoami"></strong></p>
            <button id="logoutBtn">Discard token</button>
        </section>

        <section id="anon">
            <form id="registerForm">
                <h2>Register</h2>
                <input name="username" placeholder="username" required />
                <input name="email" type="email" placeholder="email" required />
                <input name="password" type="password" placeholder="password" required />
                <button type="submit">Register</button>
            </form>

            <form id="loginForm">
                <h2>Login</h2>
                <input name="username" placeholder="username" required />
                <input name="password" type="password" placeholder="password" required />
                <button type="submit">Login</button>
            </form>
        </section>

        <pre id="log"></pre>
    </main>
    <script src="app.js"></script>
</body>
</html>
